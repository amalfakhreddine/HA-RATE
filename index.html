<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>HA-RATE</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin: 30px 0 5px;
    }

    #status {
      color: #999;
      margin-bottom: 30px;
    }

    .card {
      background: #191919;
      border-radius: 24px;
      padding: 24px;
      text-align: left;
      margin-bottom: 24px;
    }

    .label {
      color: #888;
      font-size: 13px;
      margin-top: 18px;
    }

    .label:first-child {
      margin-top: 0;
    }

    .value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    .coins {
      font-size: 38px;
    }

    .mine-button {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      background: white;
      color: black;
      cursor: pointer;
      transition: 0.15s;
    }

    .mine-button:active {
      transform: scale(0.97);
    }

    .mine-button:disabled {
      background: #333;
      color: #777;
      cursor: not-allowed;
    }

    #mineMessage {
      min-height: 24px;
      margin-top: 16px;
      color: #aaa;
      font-size: 14px;
    }

    .reward {
      color: #fff !important;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>HA-RATE</h1>

    <div id="status">
      Connecting to Telegram...
    </div>


    <div
      class="card"
      id="userCard"
      style="display:none;"
    >

      <div class="label">
        PLAYER
      </div>

      <div
        class="value"
        id="playerName"
      >
        -
      </div>


      <div class="label">
        COINS
      </div>

      <div
        class="value coins"
        id="coins"
      >
        0
      </div>


      <div class="label">
        LEVEL
      </div>

      <div
        class="value"
        id="level"
      >
        0
      </div>

    </div>


    <button
      id="mineButton"
      class="mine-button"
      style="display:none;"
    >
      MINE +100
    </button>

    <div id="mineMessage"></div>

  </div>


  <script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    let currentUser = null;
    let cooldownTimer = null;


    function updateUserDisplay(user) {

      currentUser = user;

      document.getElementById("playerName").innerText =
        user.first_name ||
        user.username ||
        "Player";

      document.getElementById("coins").innerText =
        Number(user.coins || 0).toLocaleString();

      document.getElementById("level").innerText =
        user.level || 0;

      document.getElementById("userCard").style.display =
        "block";

      document.getElementById("mineButton").style.display =
        "block";

    }


    async function startHARATE() {

      const status =
        document.getElementById("status");

      try {

        if (!tg.initData) {

          status.innerText =
            "Please open HA-RATE from Telegram.";

          return;

        }


        status.innerText =
          "Loading your account...";


        const response =
          await fetch("/api/user", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              initData: tg.initData
            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          console.error(data);

          status.innerText =
            data.error ||
            "Could not load account.";

          return;

        }


        updateUserDisplay(data);

        status.innerText =
          "Connected ✓";


      } catch (error) {

        console.error(error);

        status.innerText =
          "Connection error.";

      }

    }


    async function mine() {

      if (!currentUser) {
        return;
      }


      const button =
        document.getElementById("mineButton");

      const message =
        document.getElementById("mineMessage");


      button.disabled = true;

      message.className = "";

      message.innerText =
        "Mining...";


      try {

        const response =
          await fetch("/api/mine", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              telegram_id:
                currentUser.telegram_id
            })

          });


        const data =
          await response.json();


        if (
          response.status === 429 &&
          data.remaining_ms
        ) {

          startCooldown(
            data.remaining_ms
          );

          return;

        }


        if (!response.ok) {

          message.innerText =
            data.error ||
            "Mining failed.";

          button.disabled = false;

          return;

        }


        currentUser =
          data.user;


        updateUserDisplay(
          currentUser
        );


        message.className =
          "reward";

        message.innerText =
          `+${data.reward} COINS ✓`;


        startCooldown(
          60 * 60 * 1000
        );


      } catch (error) {

        console.error(error);

        message.innerText =
          "Connection error.";

        button.disabled = false;

      }

    }


    function startCooldown(milliseconds) {

      clearInterval(
        cooldownTimer
      );


      const button =
        document.getElementById("mineButton");

      const message =
        document.getElementById("mineMessage");


      button.disabled =
        true;


      const endTime =
        Date.now() + milliseconds;


      function updateTimer() {

        const remaining =
          endTime - Date.now();


        if (remaining <= 0) {

          clearInterval(
            cooldownTimer
          );

          button.disabled =
            false;

          button.innerText =
            "MINE +100";

          message.innerText =
            "Ready to mine.";

          return;

        }


        const hours =
          Math.floor(
            remaining /
            (1000 * 60 * 60)
          );


        const minutes =
          Math.floor(
            (
              remaining %
              (1000 * 60 * 60)
            ) /
            (1000 * 60)
          );


        const seconds =
          Math.floor(
            (
              remaining %
              (1000 * 60)
            ) /
            1000
          );


        button.innerText =
          "MINING COOLDOWN";


        message.innerText =
          `Next mine in ${hours}h ${minutes}m ${seconds}s`;

      }


      updateTimer();


      cooldownTimer =
        setInterval(
          updateTimer,
          1000
        );

    }


    document
      .getElementById("mineButton")
      .addEventListener(
        "click",
        mine
      );


    startHARATE();

  </script>

</body>
</html>
